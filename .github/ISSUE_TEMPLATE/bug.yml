name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
type: Bug
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include passwords, API keys, tokens or client/patient data.
        Security vulnerabilities must not be filed here: email security@moraph.com or use the repository's private vulnerability reporting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap / click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS (iPhone)
        - iPadOS
        - macOS
        - watchOS
        - Android
        - Web
        - Worker / API
        - MCP
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version and build, commit SHA, or deployment date.
      placeholder: e.g. 1.4.0 (212) or a1b2c3d
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or recordings
      description: Paste relevant logs (redact secrets and personal data). This is rendered as code.
      render: shell
